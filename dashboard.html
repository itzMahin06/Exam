<script>
(function(){
  try{
    var pref = localStorage.getItem('mc_theme') || 'system';
    var dark = pref === 'night' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>আমার ফলাফল | Exam - MAHIN'S CLASSROOM</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<header class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">MC</span>
      <span class="brand-text"><b>MAHIN'S CLASSROOM</b><span>Exam</span></span>
    </a>
    <div class="theme-switch">
      <button class="theme-btn" data-theme-btn aria-label="থিম পরিবর্তন করো"><i class="fa-solid fa-circle-half-stroke"></i></button>
      <div class="theme-menu" data-theme-menu>
        <button data-theme-choice="day"><i class="fa-solid fa-sun"></i> Day</button>
        <button data-theme-choice="night"><i class="fa-solid fa-moon"></i> Night</button>
        <button data-theme-choice="system"><i class="fa-solid fa-circle-half-stroke"></i> System</button>
      </div>
    </div>
    <button class="nav-toggle" data-nav-toggle aria-label="মেনু"><i class="fa-solid fa-bars"></i></button>
    <nav class="nav-links" data-nav-links>
      <a href="index.html">হোম</a>
      <a href="courses.html">কোর্সসমূহ</a>
      <a href="leaderboard.html">লিডারবোর্ড</a>

      <a href="profile.html">প্রোফাইল</a>
      <a href="admin.html" data-nav-admin style="display:none">অ্যাডমিন</a>
    </nav>
    <div data-nav-guest><a href="login.html" class="nav-btn">লগইন</a></div>

      <button class="nav-btn" data-nav-logout>লগআউট</button>
    </div>
  </div>
</header>

<main class="shell" style="padding-bottom:70px;">
  <div class="page-head flex-between">
    <div>
      <h1>আমার ফলাফল</h1>
      <p>তোমার আগের সব পরীক্ষার ফলাফল এখানে দেখতে পাবে।</p>
    </div>
    <div style="display:flex; gap:8px;">
      <a href="courses.html" class="btn btn-primary btn-sm">কোর্সসমূহ দেখো</a>
      <button class="btn btn-outline btn-sm" id="refreshBtn"><i class="fa-solid fa-rotate"></i> রিফ্রেশ</button>
    </div>
  </div>

  <div id="myResults"></div>
</main>

<footer class="site-footer"><p>©MAHIN'S CLASSROOM</p></footer>

<script type="module">
  import { getFirebase, collection, getDocs, query, where, orderBy, limit } from "./assets/js/firebase-init.js";
  import { guardPage } from "./assets/js/auth.js";
  import { Cache } from "./assets/js/cache.js";

  const { user } = await guardPage({ needAuth: true, needProfile: true });
  if (!user) throw new Error("redirecting");

  const myResultsEl = document.getElementById("myResults");

  async function loadMyResults(force = false) {
    const key = "myresults_" + user.uid;
    let results = force ? null : Cache.get(key);
    if (!results) {
      myResultsEl.innerHTML = `<div class="loader"><span class="spinner"></span> লোড হচ্ছে...</div>`;
      try {
        const { db } = await getFirebase();
        // Equality-only filter — no composite index required. Sorted client-side.
        const q = query(collection(db, "results"), where("uid", "==", user.uid), limit(100));
        const snap = await getDocs(q);
        results = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        results.sort((a, b) => toMillis(b.timestamp) - toMillis(a.timestamp));
        results = results.slice(0, 20);
        Cache.set(key, results);
      } catch (err) {
        console.error("Failed to load results:", err);
        myResultsEl.innerHTML = `<div class="banner error">ফলাফল লোড করা যায়নি: ${escapeHtml(err.message)}</div>`;
        return;
      }
    }
    if (!results.length) {
      myResultsEl.innerHTML = `<div class="empty-state"><div class="ico"><i class="fa-solid fa-folder-open"></i></div><p>এখনো কোনো পরীক্ষা দাওনি।</p><a class="btn btn-primary" href="courses.html">কোর্সসমূহ দেখো</a></div>`;
      return;
    }
    myResultsEl.innerHTML = `<div class="exam-list">` + results.map(r => `
      <div class="exam-item">
        <div>
          <h3>${escapeHtml(r.examTitle || "পরীক্ষা")}</h3>
          <div class="exam-meta">
            <span><i class="fa-solid fa-circle-check"></i> ${r.correct}</span><span><i class="fa-solid fa-circle-xmark"></i> ${r.wrong}</span><span><i class="fa-solid fa-minus"></i> ${r.unanswered}</span>
          </div>
        </div>
        <span class="chip">স্কোর: ${r.score}/${r.total}</span>
      </div>
    `).join("") + `</div>`;
  }

  function toMillis(ts) {
    if (!ts) return 0;
    if (typeof ts.toMillis === "function") return ts.toMillis();
    if (typeof ts.seconds === "number") return ts.seconds * 1000;
    return 0;
  }

  document.getElementById("refreshBtn").addEventListener("click", () => {
    Cache.remove("myresults_" + user.uid);
    loadMyResults(true);
  });

  function escapeHtml(s){ const d=document.createElement("div"); d.textContent = s||""; return d.innerHTML; }

  loadMyResults();
</script>
</body>
</html>
