<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>লগইন | Exam - MAHIN'S CLASSROOM</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">MC</span>
      <span class="brand-text"><b>MAHIN'S CLASSROOM</b><span>Exam</span></span>
    </a>
    <div></div>
  </div>
</header>

<main class="shell-narrow" style="padding:60px 20px;">
  <div class="admit-card" style="max-width:420px; margin:0 auto;">
    <div class="center" style="margin-bottom:22px;">
      <div class="brand-mark" style="margin:0 auto 14px; width:52px; height:52px; font-size:20px;">MC</div>
      <h1 style="font-size:22px;">স্বাগতম</h1>
      <p>পরীক্ষা দিতে গুগল অ্যাকাউন্ট দিয়ে সাইন-ইন করো</p>
    </div>

    <div id="banner"></div>

    <button id="googleBtn" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.7 19 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-2.1 14.1-5.6l-6.5-5.3C29.6 34.7 27 35.5 24 35.5c-5.3 0-9.7-3.1-11.3-7.5l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.4-2.3 4.4-4.2 5.8l6.5 5.3C40.9 36.4 44 30.9 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
      গুগল দিয়ে চালিয়ে যাও
    </button>

    <p class="small-note center" style="margin-top:16px;">সাইন-ইন করলে তুমি MAHIN'S CLASSROOM-এর ব্যবহারের শর্তাবলীতে সম্মত হচ্ছো।</p>
  </div>
</main>

<footer class="site-footer">
  <p>©MAHIN'S CLASSROOM</p>
</footer>

<script type="module">
  import { getFirebase, signInWithPopup } from "./assets/js/firebase-init.js";
  import { guardPage, ensureUserDoc } from "./assets/js/auth.js";

  await guardPage({ guestOnly: true });

  const banner = document.getElementById("banner");
  const btn = document.getElementById("googleBtn");

  btn.addEventListener("click", async () => {
    btn.disabled = true;
    btn.textContent = "অপেক্ষা করো...";
    try {
      const { auth, googleProvider } = await getFirebase();
      const result = await signInWithPopup(auth, googleProvider);
      const profile = await ensureUserDoc(result.user);
      location.href = profile.profileComplete ? "courses.html" : "profile.html";
    } catch (err) {
      banner.innerHTML = `<div class="banner error">সাইন-ইন ব্যর্থ হয়েছে: ${err.message}</div>`;
      btn.disabled = false;
      btn.innerHTML = `গুগল দিয়ে চালিয়ে যাও`;
    }
  });
</script>
</body>
</html>
