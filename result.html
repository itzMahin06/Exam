<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try{
    var pref = localStorage.getItem('mc_theme') || 'system';
    var dark = pref === 'night' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ফলাফল | Exam - MAHIN'S CLASSROOM</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<header class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">MC</span>
      <span class="brand-text"><b>MAHIN'S CLASSROOM</b><span>Exam</span></span>
    </a>
    <div class="theme-switch">
      <button class="theme-btn" data-theme-btn aria-label="থিম পরিবর্তন করো"><i class="fa-solid fa-circle-half-stroke"></i></button>
      <div class="theme-menu" data-theme-menu>
        <button data-theme-choice="day"><i class="fa-solid fa-sun"></i> Day</button>
        <button data-theme-choice="night"><i class="fa-solid fa-moon"></i> Night</button>
        <button data-theme-choice="system"><i class="fa-solid fa-circle-half-stroke"></i> System</button>
      </div>
    </div>
    <button class="nav-toggle" data-nav-toggle aria-label="মেনু"><i class="fa-solid fa-bars"></i></button>
    <nav class="nav-links" data-nav-links>
      <a href="index.html">হোম</a>
      <a href="courses.html">কোর্সসমূহ</a>
      <a href="leaderboard.html">লিডারবোর্ড</a>
      <a href="dashboard.html">আমার ফলাফল</a>
      <a href="profile.html">প্রোফাইল</a>
      <a href="admin.html" data-nav-admin style="display:none">অ্যাডমিন</a>
    </nav>
    <div class="account-switch">
      <button class="account-btn" data-account-btn aria-label="অ্যাকাউন্ট">
        <img data-nav-avatar alt="" style="display:none">
        <i class="fa-solid fa-circle-user" data-nav-guest-icon></i>
      </button>
      <div class="account-menu" data-account-menu>
        <div class="account-menu-name" data-nav-name style="display:none"></div>
        <a href="profile.html" data-account-profile-link style="display:none"><i class="fa-solid fa-user"></i> প্রোফাইল</a>
        <a href="login.html" data-account-login-link><i class="fa-solid fa-right-to-bracket"></i> লগইন করো</a>
        <button data-nav-logout style="display:none"><i class="fa-solid fa-right-from-bracket"></i> লগআউট</button>
      </div>
    </div>
  </div>
</header>

<main class="shell-narrow" style="padding:30px 20px 70px;" id="resultBody">
  <div class="loader"><span class="spinner"></span> লোড হচ্ছে...</div>
</main>

<footer class="site-footer">
  <div class="footer-links">
    <a href="about.html">আমাদের সম্পর্কে</a>
    <a href="contact.html">যোগাযোগ</a>
    <a href="privacy-policy.html">প্রাইভেসি পলিসি</a>
    <a href="refund-policy.html">রিফান্ড পলিসি</a>
  </div>
  <p>©MAHIN'S CLASSROOM</p>
</footer>

<script type="module">
  import { guardPage } from "./assets/js/auth.js";
  await guardPage({ needAuth: true, needProfile: true });

  const params = new URLSearchParams(location.search);
  const examId = params.get("examId") || "";
  const courseIdParam = params.get("courseId") || "";
  const raw = sessionStorage.getItem("mc_review");
  const body = document.getElementById("resultBody");

  if (!raw) {
    body.innerHTML = `
      <div class="empty-state">
        <div class="ico"><i class="fa-solid fa-file-lines"></i></div>
        <p>দেখানোর মতো কোনো সাম্প্রতিক ফলাফল নেই। পরীক্ষা শেষ করার পরপরই ফলাফল এখানে দেখা যায়।</p>
        <a class="btn btn-primary" href="courses.html">কোর্সসমূহ দেখো</a>
      </div>`;
  } else {
    const data = JSON.parse(raw);
    body.innerHTML = `
      <div class="result-hero">
        <div class="small-note" style="color:#CFE3DA;">${escapeHtml(data.examTitle || "পরীক্ষা")}</div>
        <div class="score">${data.score}<span class="out-of">/${data.total}</span></div>
        <div class="out-of">তোমার স্কোর — ${data.percentage}%</div>
      </div>

      <div class="banner ${data.isFirstAttempt ? "ok" : "info"}" style="margin-top:16px;">
        ${data.isFirstAttempt
          ? "এটি তোমার প্রথম চেষ্টা — স্কোর সংরক্ষণ করা হয়েছে এবং লিডারবোর্ড ও তোমার ফলাফলে দেখা যাবে।"
          : "এটি একটি অনুশীলন (practice) চেষ্টা — এই স্কোরটি সংরক্ষণ করা হয়নি এবং লিডারবোর্ডে যোগ হবে না। শুধু তোমার প্রথম চেষ্টাই গণনা করা হয়।"}
      </div>

      <div class="result-stats">
        <div class="stat-box correct"><b>${data.correct}</b><span>সঠিক</span></div>
        <div class="stat-box wrong"><b>${data.wrong}</b><span>ভুল</span></div>
        <div class="stat-box skip"><b>${data.unanswered}</b><span>বাদ দেওয়া</span></div>
      </div>

      <div class="flex-between" style="margin-bottom:16px; gap:8px;">
        <a href="courses.html" class="btn btn-outline btn-sm">কোর্সসমূহ</a>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          ${examId ? `<a href="exam.html?id=${encodeURIComponent(examId)}" class="btn btn-outline btn-sm"><i class="fa-solid fa-rotate-right"></i> আবার পরীক্ষা দাও</a>` : ""}
          ${examId ? `<a href="solve-sheet.html?id=${encodeURIComponent(examId)}" target="_blank" class="btn btn-primary btn-sm"><i class="fa-solid fa-file-arrow-down"></i> সমাধান শীট</a>` : ""}
          ${examId ? `<a href="leaderboard.html?courseId=${encodeURIComponent(courseIdParam)}" class="btn btn-amber btn-sm"><i class="fa-solid fa-trophy"></i> লিডারবোর্ড দেখো</a>` : ""}
        </div>
      </div>

      <h2 style="font-size:18px; margin:24px 0 12px;">বিস্তারিত পর্যালোচনা</h2>
      <div id="reviewList"></div>
    `;

    const list = document.getElementById("reviewList");
    list.innerHTML = data.review.map((r, i) => {
      const status = r.given === null ? "skip" : (r.given === r.correct_answer ? "correct" : "wrong");
      const statusLabel = status === "correct" ? "সঠিক" : status === "wrong" ? "ভুল" : "বাদ দেওয়া";
      const optsHtml = Object.keys(r.options || {}).map(k => {
        let cls = "";
        if (k === r.correct_answer) cls = "is-correct";
        else if (k === r.given && r.given !== r.correct_answer) cls = "is-wrong";
        return `<div class="review-opt ${cls}"><b>${k}.</b><span>${r.options[k]}</span></div>`;
      }).join("");
      return `
        <div class="review-item">
          <div class="flex-between">
            <span class="qno" style="margin:0;">প্রশ্ন ${i + 1}</span>
            <span class="tag ${status}">${statusLabel}</span>
          </div>
          ${r.uddipok ? `<div class="uddipok" style="margin-top:10px;">${r.uddipok}</div>` : ""}
          <div class="qtext" style="margin:10px 0;">${r.question}</div>
          <div class="review-opts">${optsHtml}</div>
          ${r.explanation ? `<div class="review-explain"><b>ব্যাখ্যা:</b> ${r.explanation}</div>` : ""}
        </div>`;
    }).join("");
  }

  function escapeHtml(s){ const d=document.createElement("div"); d.textContent = s||""; return d.innerHTML; }
</script>
</body>
</html>
