<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try{
    var pref = localStorage.getItem('mc_theme') || 'system';
    var dark = pref === 'night' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>প্রোফাইল | Exam - MAHIN'S CLASSROOM</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<header class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">MC</span>
      <span class="brand-text"><b>MAHIN'S CLASSROOM</b><span>Exam</span></span>
    </a>
    <div class="theme-switch">
      <button class="theme-btn" data-theme-btn aria-label="থিম পরিবর্তন করো"><i class="fa-solid fa-circle-half-stroke"></i></button>
      <div class="theme-menu" data-theme-menu>
        <button data-theme-choice="day"><i class="fa-solid fa-sun"></i> Day</button>
        <button data-theme-choice="night"><i class="fa-solid fa-moon"></i> Night</button>
        <button data-theme-choice="system"><i class="fa-solid fa-circle-half-stroke"></i> System</button>
      </div>
    </div>
    <button class="nav-toggle" data-nav-toggle aria-label="মেনু"><i class="fa-solid fa-bars"></i></button>
    <nav class="nav-links" data-nav-links>
      <a href="index.html">হোম</a>
      <a href="courses.html">কোর্সসমূহ</a>
      <a href="leaderboard.html">লিডারবোর্ড</a>
      <a href="dashboard.html">আমার ফলাফল</a>
      <a href="profile.html">প্রোফাইল</a>
      <a href="admin.html" data-nav-admin style="display:none">অ্যাডমিন</a>
    </nav>
    <div class="account-switch">
      <button class="account-btn" data-account-btn aria-label="অ্যাকাউন্ট">
        <img data-nav-avatar alt="" style="display:none">
        <i class="fa-solid fa-circle-user" data-nav-guest-icon></i>
      </button>
      <div class="account-menu" data-account-menu>
        <div class="account-menu-name" data-nav-name style="display:none"></div>
        <a href="profile.html" data-account-profile-link style="display:none"><i class="fa-solid fa-user"></i> প্রোফাইল</a>
        <a href="login.html" data-account-login-link><i class="fa-solid fa-right-to-bracket"></i> লগইন করো</a>
        <button data-nav-logout style="display:none"><i class="fa-solid fa-right-from-bracket"></i> লগআউট</button>
      </div>
    </div>
  </div>
</header>

<main class="shell-narrow" style="padding:36px 20px 70px;">
  <div class="page-head flex-between">
    <div>
      <h1 id="pageTitle">প্রোফাইল</h1>
      <p id="pageSub">তোমার তথ্য এখানে দেখা যাচ্ছে।</p>
    </div>
    <div id="profileLinks" style="display:none; gap:8px;" class="flex-between">
      <a href="courses.html" class="btn btn-outline btn-sm">কোর্সসমূহ</a>
      <a href="dashboard.html" class="btn btn-outline btn-sm">আমার ফলাফল</a>
    </div>
  </div>

  <div id="banner"></div>

  <!-- read-only profile card -->
  <div class="profile-card" id="profileView" style="display:none;">
    <button class="profile-edit-btn" id="editIconBtn" aria-label="সম্পাদনা"><i class="fa-solid fa-pen"></i></button>
    <img class="avatar-lg" id="pvAvatar" src="" alt="">
    <h2 id="pvName"></h2>
    <div class="email" id="pvEmail"></div>
    <div class="profile-info-grid">
      <div class="profile-info-item">
        <div class="lbl"><i class="fa-solid fa-graduation-cap"></i> এইচএসসি ব্যাচ</div>
        <div class="val" id="pvBatch">-</div>
      </div>
      <div class="profile-info-item">
        <div class="lbl"><i class="fa-solid fa-rotate"></i> সেকেন্ড টাইমার</div>
        <div class="val" id="pvSecondTimer">-</div>
      </div>
      <div class="profile-info-item">
        <div class="lbl"><i class="fa-solid fa-bullseye"></i> প্রস্তুতি</div>
        <div class="val" id="pvPreparedFor">-</div>
      </div>
    </div>
  </div>

  <!-- edit form -->
  <form id="profileForm" class="admit-card" style="display:none;">
    <div class="center" style="margin-bottom:18px;">
      <img class="avatar-lg" id="feAvatar" src="" alt="" style="margin-bottom:10px;">
    </div>
    <div class="field">
      <label>নাম</label>
      <input type="text" id="fName" disabled>
    </div>
    <div class="field">
      <label>ইমেইল</label>
      <input type="text" id="fEmail" disabled>
    </div>

    <div class="field">
      <label>এইচএসসি ব্যাচ</label>
      <select id="fBatch" required>
        <option value="">নির্বাচন করো</option>
        <option>HSC 2024</option>
        <option>HSC 2025</option>
        <option>HSC 2026</option>
        <option>HSC 2027</option>
        <option>Admission Candidate</option>
      </select>
    </div>

    <div class="field">
      <label>সেকেন্ড টাইমার?</label>
      <div class="radio-row" id="fSecondTimer">
        <label class="radio-pill"><input type="radio" name="secondTimer" value="yes">হ্যাঁ</label>
        <label class="radio-pill"><input type="radio" name="secondTimer" value="no">না</label>
      </div>
    </div>

    <div class="field">
      <label>কিসের জন্য প্রস্তুতি নিচ্ছো?</label>
      <div class="radio-row" id="fPreparedFor">
        <label class="radio-pill"><input type="radio" name="preparedFor" value="engineering">ইঞ্জিনিয়ারিং</label>
        <label class="radio-pill"><input type="radio" name="preparedFor" value="varsity">ভার্সিটি</label>
        <label class="radio-pill"><input type="radio" name="preparedFor" value="medical">মেডিকেল</label>
      </div>
    </div>

    <div style="display:flex; gap:10px;">
      <button type="submit" class="btn btn-primary" style="flex:1" id="saveBtn">প্রোফাইল সংরক্ষণ করো</button>
      <button type="button" class="btn btn-outline" id="cancelEditBtn" style="display:none;">বাতিল</button>
    </div>
  </form>
</main>

<footer class="site-footer"><p>©MAHIN'S CLASSROOM</p></footer>

<script type="module">
  import { getFirebase, doc, updateDoc } from "./assets/js/firebase-init.js";
  import { guardPage, saveProfileCache } from "./assets/js/auth.js";

  const { user, profile } = await guardPage({ needAuth: true });
  if (!user) throw new Error("not signed in");

  const batchLabels = {}; // batch values are shown as-is (already human readable)
  const secondTimerLabels = { yes: "হ্যাঁ", no: "না" };
  const preparedForLabels = { engineering: "ইঞ্জিনিয়ারিং", varsity: "ভার্সিটি", medical: "মেডিকেল" };

  const profileView = document.getElementById("profileView");
  const profileForm = document.getElementById("profileForm");
  const cancelEditBtn = document.getElementById("cancelEditBtn");

  function renderView() {
    document.getElementById("pvAvatar").src = profile.photoURL || user.photoURL || "";
    document.getElementById("pvName").textContent = profile.name || user.displayName || "";
    document.getElementById("pvEmail").textContent = profile.email || user.email || "";
    document.getElementById("pvBatch").textContent = profile.hscBatch || "-";
    document.getElementById("pvSecondTimer").textContent = secondTimerLabels[profile.secondTimer] || "-";
    document.getElementById("pvPreparedFor").textContent = preparedForLabels[profile.preparedFor] || "-";
    profileView.style.display = "";
    profileForm.style.display = "none";
  }

  function fillForm() {
    document.getElementById("feAvatar").src = profile.photoURL || user.photoURL || "";
    document.getElementById("fName").value = profile.name || "";
    document.getElementById("fEmail").value = profile.email || "";
    document.getElementById("fBatch").value = profile.hscBatch || "";
    setPill("fSecondTimer", profile.secondTimer || "");
    setPill("fPreparedFor", profile.preparedFor || "");
  }

  function showForm() {
    fillForm();
    profileView.style.display = "none";
    profileForm.style.display = "";
  }

  if (profile.profileComplete) {
    document.getElementById("pageTitle").textContent = "প্রোফাইল";
    document.getElementById("pageSub").textContent = "তোমার তথ্য এখানে দেখা যাচ্ছে।";
    document.getElementById("profileLinks").style.display = "flex";
    cancelEditBtn.style.display = "";
    renderView();
  } else {
    document.getElementById("pageTitle").textContent = "প্রোফাইল সম্পূর্ণ করো";
    document.getElementById("pageSub").textContent = "পরীক্ষা শুরু করার আগে নিচের তথ্যগুলো দাও।";
    showForm();
  }

  document.getElementById("editIconBtn").addEventListener("click", showForm);
  cancelEditBtn.addEventListener("click", () => { document.getElementById("banner").innerHTML = ""; renderView(); });

  function setPill(containerId, value) {
    document.querySelectorAll(`#${containerId} .radio-pill`).forEach(pill => {
      const input = pill.querySelector("input");
      pill.classList.toggle("checked", input.value === value);
      if (input.value === value) input.checked = true;
    });
  }
  document.querySelectorAll(".radio-pill").forEach(pill => {
    const containerId = pill.closest(".radio-row").id;
    pill.addEventListener("click", () => {
      document.querySelectorAll(`#${containerId} .radio-pill`).forEach(p => p.classList.remove("checked"));
      pill.classList.add("checked");
    });
  });

  const form = document.getElementById("profileForm");
  const banner = document.getElementById("banner");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const batch = document.getElementById("fBatch").value;
    const secondTimer = form.querySelector('input[name=secondTimer]:checked')?.value;
    const preparedFor = form.querySelector('input[name=preparedFor]:checked')?.value;

    if (!batch || !secondTimer || !preparedFor) {
      banner.innerHTML = `<div class="banner error">দয়া করে সবগুলো ঘর পূরণ করো।</div>`;
      return;
    }

    const saveBtn = document.getElementById("saveBtn");
    saveBtn.disabled = true;
    saveBtn.textContent = "সংরক্ষণ হচ্ছে...";

    const updated = {
      ...profile,
      hscBatch: batch,
      secondTimer,
      preparedFor,
      profileComplete: true
    };

    try {
      const { db } = await getFirebase();
      await updateDoc(doc(db, "users", user.uid), {
        hscBatch: batch, secondTimer, preparedFor, profileComplete: true
      });
      saveProfileCache(user.uid, updated);
      Object.assign(profile, updated);

      if (!document.getElementById("profileLinks").style.display || document.getElementById("profileLinks").style.display === "none") {
        // first-time completion — go straight to courses like before
        location.href = "courses.html";
        return;
      }

      banner.innerHTML = `<div class="banner ok">প্রোফাইল হালনাগাদ হয়েছে।</div>`;
      renderView();
    } catch (err) {
      banner.innerHTML = `<div class="banner error">সংরক্ষণ ব্যর্থ হয়েছে: ${err.message}</div>`;
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "প্রোফাইল সংরক্ষণ করো";
    }
  });
</script>
</body>
</html>
