<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try{
    var pref = localStorage.getItem('mc_theme') || 'system';
    var dark = pref === 'night' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>পরীক্ষা | Exam - MAHIN'S CLASSROOM</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="exam-top">
  <div class="shell exam-top-inner">
    <a href="courses.html" class="brand" style="color:var(--ink)">
      <span class="brand-mark" style="background:var(--green-mid); color:#fff;">MC</span>
      <span class="brand-text"><b id="examTitle" style="color:var(--ink)">পরীক্ষা লোড হচ্ছে...</b><span style="color:var(--ink-soft)" id="examProgressText">০ / ০ উত্তর দেওয়া হয়েছে</span></span>
    </a>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="timer" id="timer"><i class="fa-solid fa-clock"></i> <span id="timerText">--:--</span></div>
  </div>
</div>

<main class="shell-narrow" id="examBody" style="padding-bottom:40px;">
  <div class="loader"><span class="spinner"></span> প্রশ্ন লোড হচ্ছে...</div>
</main>

<div class="exam-nav-actions shell-narrow" id="bottomActions" style="display:none;">
  <button class="btn btn-outline" id="topBtn">উপরে যাও</button>
  <button class="btn btn-primary" id="submitBtn">পরীক্ষা জমা দাও</button>
</div>

<button class="nav-fab" id="navFab" style="display:none;">
  <i class="fa-solid fa-compass"></i> প্রশ্ন নেভিগেটর <b id="navFabCount">0/0</b>
</button>

<div class="modal-backdrop" id="navBackdrop">
  <div class="nav-popup">
    <div class="nav-popup-head">
      <h3>প্রশ্ন নেভিগেটর</h3>
      <button class="nav-popup-close" id="navClose"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="nav-legend" style="margin-bottom:12px;">
      <span><span class="legend-dot" style="background:var(--correct-soft); border:1.5px solid var(--correct);"></span> উত্তর দেওয়া</span>
      <span><span class="legend-dot" style="background:#fff; border:1.5px solid var(--border);"></span> বাকি আছে</span>
    </div>
    <div class="qgrid" id="qgrid"></div>
    <button class="btn btn-primary btn-block btn-sm" id="navSubmitBtn">পরীক্ষা জমা দাও</button>
  </div>
</div>

<div class="modal-backdrop" id="confirmBackdrop">
  <div class="nav-popup center" style="max-width:340px;">
    <p style="margin-bottom:6px; font-weight:600;">পরীক্ষা জমা দিতে চাও?</p>
    <p class="small-note" id="confirmText" style="margin-bottom:16px;"></p>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button class="btn btn-outline btn-sm" id="confirmCancel">না</button>
      <button class="btn btn-primary btn-sm" id="confirmOk">হ্যাঁ, জমা দাও</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-links">
    <a href="about.html">আমাদের সম্পর্কে</a>
    <a href="contact.html">যোগাযোগ</a>
    <a href="privacy-policy.html">প্রাইভেসি পলিসি</a>
    <a href="refund-policy.html">রিফান্ড পলিসি</a>
  </div>
  <p>©MAHIN'S CLASSROOM</p>
</footer>

<script type="module" src="assets/js/exam.js"></script>
</body>
</html>
