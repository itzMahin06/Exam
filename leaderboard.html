<script type="module">
  import { getFirebase, doc, getDoc, collection, getDocs, query, where, limit } from "./assets/js/firebase-init.js";
  import { guardPage, hasCourseAccess } from "./assets/js/auth.js";
  import { Cache } from "./assets/js/cache.js";

  const { user, profile } = await guardPage({ needAuth: true, needProfile: true });
  if (!user) throw new Error("redirecting");

  const courseSelect = document.getElementById("courseSelect");
  const lbList = document.getElementById("lbList");
  const params = new URLSearchParams(location.search);
  const preselectCourse = params.get("courseId") || params.get("examId"); // examId kept for old links, resolved below

  let myCourses = [];

  async function loadCourseOptions() {
    try {
      const { db } = await getFirebase();

      let courses = Cache.get("coursesIndex");
      if (!courses) {
        const snap = await getDoc(doc(db, "meta", "coursesIndex"));
        courses = snap.exists() ? (snap.data().courses || []) : [];
        Cache.set("coursesIndex", courses);
      }

      // Only courses the student actually has access to (free, or approved
      // enrollment) — matches what they can otherwise see on course.html.
      myCourses = courses.filter(c => hasCourseAccess(profile, c));

      if (!myCourses.length) {
        courseSelect.innerHTML = `<option value="">কোনো কোর্স নেই</option>`;
        lbList.innerHTML = `<div class="empty-state"><div class="ico"><i class="fa-solid fa-inbox"></i></div><p>তুমি এখনো কোনো কোর্সে ভর্তি নেই। কোর্সে ভর্তি হলে সেই কোর্সের লিডারবোর্ড এখানে দেখা যাবে।</p><a class="btn btn-primary" href="courses.html">কোর্সসমূহ দেখো</a></div>`;
        return;
      }

      courseSelect.innerHTML = myCourses.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");

      let initialCourseId = courseSelect.value;
      if (preselectCourse && myCourses.some(c => c.id === preselectCourse)) {
        initialCourseId = preselectCourse;
      } else if (preselectCourse) {
        // maybe an old-style ?examId= link — resolve to its course
        let exams = Cache.get("examsIndex");
        if (!exams) {
          const snap = await getDoc(doc(db, "meta", "examsIndex"));
          exams = snap.exists() ? (snap.data().exams || []) : [];
          Cache.set("examsIndex", exams);
        }
        const ex = exams.find(e => e.id === preselectCourse);
        if (ex && myCourses.some(c => c.id === ex.courseId)) initialCourseId = ex.courseId;
      }
      if (initialCourseId) courseSelect.value = initialCourseId;

      loadLeaderboard(courseSelect.value);
    } catch (err) {
      console.error("Failed to load course list:", err);
      lbList.innerHTML = `<div class="banner error">কোর্সের তালিকা লোড করা যায়নি: ${escapeHtml(err.message)}</div>`;
    }
  }

  async function loadLeaderboard(courseId, force = false) {
    if (!courseId) return;
    const key = "leaderboard_course_" + courseId;
    let rows = force ? null : Cache.get(key);
    if (!rows) {
      lbList.innerHTML = `<div class="loader"><span class="spinner"></span> লোড হচ্ছে...</div>`;
      try {
        const { db } = await getFirebase();
        // Equality-only filter — no composite index required.
        // limit(3000) is a generous safety cap covering every attempt across
        // every exam in this course, not a "top N" cutoff.
        const q = query(collection(db, "results"), where("courseId", "==", courseId), limit(3000));
        const snap = await getDocs(q);
        const raw = snap.docs.map(d => d.data());

        // Aggregate per student: total score across every exam they've
        // attempted in this course.
        const byUid = new Map();
        raw.forEach(r => {
          const entry = byUid.get(r.uid) || { uid: r.uid, userName: r.userName || "শিক্ষার্থী", totalScore: 0, examsTaken: 0 };
          entry.totalScore += (r.score || 0);
          entry.examsTaken += 1;
          byUid.set(r.uid, entry);
        });
        rows = Array.from(byUid.values());
        rows.sort((a, b) => b.totalScore - a.totalScore);
        rows.forEach(r => { r.totalScore = Math.round(r.totalScore * 100) / 100; });
        Cache.set(key, rows);
      } catch (err) {
        console.error("Failed to load leaderboard:", err);
        lbList.innerHTML = `<div class="banner error">লিডারবোর্ড লোড করা যায়নি: ${escapeHtml(err.message)}</div>`;
        return;
      }
    }
    renderRows(rows);
  }

  function renderRows(rows) {
    document.getElementById("participantCount").textContent = `মোট ${rows.length} জন অংশ নিয়েছে`;
    if (!rows.length) {
      lbList.innerHTML = `<div class="empty-state"><div class="ico"><i class="fa-solid fa-trophy"></i></div><p>এই কোর্সে এখনো কেউ কোনো পরীক্ষা দেয়নি।</p></div>`;
      return;
    }
    lbList.innerHTML = rows.map((r, i) => `
      <div class="lb-row ${i === 0 ? "top1" : i === 1 ? "top2" : i === 2 ? "top3" : ""} ${r.uid === user.uid ? "is-me" : ""}">
        <div class="lb-rank">${i + 1}</div>
        <div class="lb-name">${escapeHtml(r.userName)}${r.uid === user.uid ? " (তুমি)" : ""}<div class="lb-sub">${r.examsTaken} টি পরীক্ষা দিয়েছে</div></div>
        <div class="lb-score">${r.totalScore}</div>
      </div>
    `).join("");
  }

  courseSelect.addEventListener("change", () => loadLeaderboard(courseSelect.value));
  document.getElementById("refreshBtn").addEventListener("click", () => {
    Cache.remove("coursesIndex");
    if (courseSelect.value) Cache.remove("leaderboard_course_" + courseSelect.value);
    loadCourseOptions();
  });

  function escapeHtml(s){ const d=document.createElement("div"); d.textContent = s||""; return d.innerHTML; }

  loadCourseOptions();
</script>
