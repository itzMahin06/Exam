    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

</script>

<main class="shell-narrow" style="padding:30px 20px 70px;">
  <div class="page-head">
    <h1>লিডারবোর্ড</h1>
    <p>একটি কোর্স বেছে নাও — সেই কোর্সের প্রতিটি পরীক্ষার আলাদা লিডারবোর্ড এখানে দেখতে পাবে।</p>
  </div>

  <div class="field">
    <label>কোর্স</label>
    <select id="courseSelect"></select>
  </div>

  <div class="flex-between" style="margin-bottom:14px;">
    <span class="small-note" id="examCount"></span>
    <button class="btn btn-outline btn-sm" id="refreshBtn"><i class="fa-solid fa-rotate"></i> রিফ্রেশ</button>
  </div>

  <div id="lbList"></div>
</main>

<script type="module">
  import { getFirebase, doc, getDoc, collection, getDocs, query, where, limit } from "./assets/js/firebase-init.js";
  import { guardPage, hasCourseAccess } from "./assets/js/auth.js";
  import { Cache } from "./assets/js/cache.js";

  const { user, profile } = await guardPage({ needAuth: true, needProfile: true });
  if (!user) throw new Error("redirecting");

  const courseSelect = document.getElementById("courseSelect");
  const lbList = document.getElementById("lbList");
  const examCountEl = document.getElementById("examCount");
  const params = new URLSearchParams(location.search);
  const preselectCourse = params.get("courseId") || params.get("examId"); // examId kept for old links, resolved below

  let myCourses = [];
  let allExams = [];

  async function loadCourseOptions() {
    try {
      const { db } = await getFirebase();

      let courses = Cache.get("coursesIndex");
      if (!courses) {
        const snap = await getDoc(doc(db, "meta", "coursesIndex"));
        courses = snap.exists() ? (snap.data().courses || []) : [];
        Cache.set("coursesIndex", courses);
      }

      let exams = Cache.get("examsIndex");
      if (!exams) {
        const snap = await getDoc(doc(db, "meta", "examsIndex"));
        exams = snap.exists() ? (snap.data().exams || []) : [];
        Cache.set("examsIndex", exams);
      }
      allExams = exams;

      // Only courses the student actually has access to (free, or approved
      // enrollment) — matches what they can otherwise see on course.html.
      myCourses = courses.filter(c => hasCourseAccess(profile, c));

      if (!myCourses.length) {
        courseSelect.innerHTML = `<option value="">কোনো কোর্স নেই</option>`;
        lbList.innerHTML = `<div class="empty-state"><div class="ico"><i class="fa-solid fa-inbox"></i></div><p>তুমি এখনো কোনো কোর্সে ভর্তি নেই। কোর্সে ভর্তি হলে সেই কোর্সের লিডারবোর্ড এখানে দেখা যাবে।</p><a class="btn btn-primary" href="courses.html">কোর্সসমূহ দেখো</a></div>`;
        return;
      }

      courseSelect.innerHTML = myCourses.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");

      let initialCourseId = courseSelect.value;
      if (preselectCourse && myCourses.some(c => c.id === preselectCourse)) {
        initialCourseId = preselectCourse;
      } else if (preselectCourse) {
        // maybe an old-style ?examId= link — resolve to its course
        const ex = exams.find(e => e.id === preselectCourse);
        if (ex && myCourses.some(c => c.id === ex.courseId)) initialCourseId = ex.courseId;
      }
      if (initialCourseId) courseSelect.value = initialCourseId;

      loadCourseLeaderboards(courseSelect.value);
    } catch (err) {
      console.error("Failed to load course list:", err);
      lbList.innerHTML = `<div class="banner error">কোর্সের তালিকা লোড করা যায়নি: ${escapeHtml(err.message)}</div>`;
    }
  }

  async function loadCourseLeaderboards(courseId, force = false) {
    if (!courseId) return;
    const courseExams = allExams.filter(e => e.courseId === courseId);

    if (!courseExams.length) {
      examCountEl.textContent = "";
      lbList.innerHTML = `<div class="empty-state"><div class="ico"><i class="fa-solid fa-inbox"></i></div><p>এই কোর্সে এখনো কোনো পরীক্ষা যোগ করা হয়নি।</p></div>`;
      return;
    }

    examCountEl.textContent = `${courseExams.length} টি পরীক্ষা`;
    lbList.innerHTML = courseExams.map(ex => `
      <div class="lb-exam-group" data-exam-group="${ex.id}">
        <div class="lb-exam-head">
          <h2>${escapeHtml(ex.title)}</h2>
          <span class="small-note" data-exam-count="${ex.id}">লোড হচ্ছে...</span>
        </div>
        <div data-exam-rows="${ex.id}"><div class="loader"><span class="spinner"></span> লোড হচ্ছে...</div></div>
      </div>
    `).join("");

    // Each exam's leaderboard is a single equality-filtered read, cached
    // independently so revisiting this course later costs nothing until
    // "রিফ্রেশ" is tapped.
    await Promise.all(courseExams.map(ex => loadExamLeaderboard(ex.id, force)));
  }

  async function loadExamLeaderboard(examId, force = false) {
    const key = "leaderboard_" + examId;
    let rows = force ? null : Cache.get(key);
    if (!rows) {
      try {
        const { db } = await getFirebase();
        const q = query(collection(db, "results"), where("examId", "==", examId), limit(2000));
        const snap = await getDocs(q);
        rows = snap.docs.map(d => d.data());
        rows.sort((a, b) => (b.score || 0) - (a.score || 0));
        Cache.set(key, rows);
      } catch (err) {
        console.error("Failed to load leaderboard for", examId, err);
        const rowsEl = document.querySelector(`[data-exam-rows="${examId}"]`);
        if (rowsEl) rowsEl.innerHTML = `<div class="banner error">লোড করা যায়নি: ${escapeHtml(err.message)}</div>`;
        return;
      }
    }
    renderExamRows(examId, rows);
  }

  function renderExamRows(examId, rows) {
    const countEl = document.querySelector(`[data-exam-count="${examId}"]`);
    const rowsEl = document.querySelector(`[data-exam-rows="${examId}"]`);
    if (!countEl || !rowsEl) return;

    countEl.textContent = `${rows.length} জন অংশ নিয়েছে`;
    if (!rows.length) {
      rowsEl.innerHTML = `<p class="small-note" style="padding:4px 0 6px;">এখনো কেউ এই পরীক্ষাটি দেয়নি।</p>`;
      return;
    }
    rowsEl.innerHTML = rows.map((r, i) => `
      <div class="lb-row ${i === 0 ? "top1" : i === 1 ? "top2" : i === 2 ? "top3" : ""} ${r.uid === user.uid ? "is-me" : ""}">
        <div class="lb-rank">${i + 1}</div>
        <div class="lb-name">${escapeHtml(r.userName || "শিক্ষার্থী")}${r.uid === user.uid ? " (তুমি)" : ""}</div>
        <div class="lb-score">${r.score}/${r.total}</div>
      </div>
    `).join("");
  }

  courseSelect.addEventListener("change", () => loadCourseLeaderboards(courseSelect.value));
  document.getElementById("refreshBtn").addEventListener("click", () => {
    Cache.remove("coursesIndex");
    Cache.remove("examsIndex");
    if (courseSelect.value) {
      allExams.filter(e => e.courseId === courseSelect.value).forEach(ex => Cache.remove("leaderboard_" + ex.id));
    }
    loadCourseOptions();
  });

  function escapeHtml(s){ const d=document.createElement("div"); d.textContent = s||""; return d.innerHTML; }

  loadCourseOptions();
</script>
</body>
